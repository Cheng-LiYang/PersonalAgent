app:
  name: Personal Knowledge Agent
  data_dir: /app/data
  knowledge_base: /app/KnowledgeBase

document:
  chunk_size: 1000
  chunk_overlap: 300
  excluded_directories:
    - .git
    - .venv
    - venv
    - env
    - node_modules
    - __pycache__
    - .pytest_cache
    - build
    - dist

embedding:
  provider: hash
  local_model: BAAI/bge-m3
  openai_model: text-embedding-3-small

retrieval:
  vector_weight: 0.65
  bm25_weight: 0.35
  candidate_count: 20
  top_k: 3
  reranker_model: null

llm:
  provider: extractive
  model: offline-extractive
  base_url: https://api.deepseek.com
  openai_model: gpt-4o-mini
  local_base_url: http://host.docker.internal:11434/v1
  local_model: qwen2.5:7b

agent:
  confidence_threshold: 0.7
  max_retries: 1
  max_tool_calls: 6
  max_parallel_tools: 3
  tool_timeout_seconds: 30
  enable_llm_critic: true

context:
  max_evidence_chars: 12000
  max_chunk_chars: 2500
  max_history_chars: 4000
  max_tool_context_chars: 2000

harness:
  enabled: true
  max_wall_time_seconds: 120
  max_node_steps: 32
  max_tool_calls: 16
  max_retries: 4
  max_context_chars: 120000

jobs:
  index_workers: 1
  index_queue_capacity: 4
  chat_workers: 4
  chat_queue_capacity: 32
  completion_ttl_seconds: 86400

api:
  host: 0.0.0.0
  port: 8000
  max_upload_mb: 50
